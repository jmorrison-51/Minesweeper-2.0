name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Minesweeper.Core.Tests -c Release

      - name: Publish
        run: dotnet publish src/Minesweeper.Web -c Release -o out

      # The site is served from /<repo name>/, not the domain root.
      - name: Set base path
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' out/wwwroot/index.html

      - name: Check base path
        run: grep -q '<base href="/${{ github.event.repository.name }}/" />' out/wwwroot/index.html

      # Without this, Jekyll would drop the _framework folder.
      - name: Disable Jekyll
        run: touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
